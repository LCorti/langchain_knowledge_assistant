seed: 42
dev_size: 0.3
cache_dir: data/langchain_queries
split: test # held-out; use retrieval_diagnostics.yaml for dev tuning
results_dir: results
cutoffs: [1, 3, 5, 10, 20, 50]
dataset_path: freshstack/queries-oct-2024
dataset_name: langchain
dataset_split: test

retriever:
  mode: hybrid
  fusion:
    weights: [0.5, 0.5] # BM25, FAISS
    c: 60
reranker:
  reranker_model: Alibaba-NLP/gte-reranker-modernbert-base
  reranker_device: cuda
  rerank_k: 100
  reranker_batch_size: 16
# Final output depth is set to max(cutoffs) by the evaluator.
