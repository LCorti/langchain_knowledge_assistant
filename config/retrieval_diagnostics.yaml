# Dev-only tuning settings, independent of config/evaluation.yaml.
# Keep split provenance (seed, dev_size, dataset settings) aligned with evaluation
# to reuse the same disjoint dev/test cache.
seed: 42
dev_size: 0.3
cache_dir: data/langchain_queries
split: dev
results_dir: results
cutoffs: [1, 3, 5, 10, 20, 50]
dataset_path: freshstack/queries-oct-2024
dataset_name: langchain
dataset_split: test

# Each named configuration overrides BM25/FAISS configs plus these defaults.
# Retrieval depths are NOT increased to match cutoffs.
examples_per_kind: 5
text_chars: 2000

defaults:
  retriever:
    mode: hybrid
    fusion:
      weights: [0.5, 0.5] # BM25, FAISS
      c: 60
  bm25:
    retriever_params:
      k: 100
  faiss:
    retriever_params:
      k: 100
  reranker:
    reranker_model: Alibaba-NLP/gte-reranker-modernbert-base
    reranker_device: cuda # use cpu if CUDA is unavailable
    rerank_k: 100
    top_n: 50 # keep >= largest evaluation cutoff for a full-depth comparison
    reranker_batch_size: 16

configurations:
  similarity:
    faiss:
      retriever_params:
        search_type: similarity
  mmr:
    faiss:
      retriever_params:
        search_type: mmr
        fetch_k: 200
        lambda_mult: 0.5
  equal_weight_fusion:
    retriever:
      fusion:
        weights: [0.5, 0.5] # BM25, FAISS
        c: 60
