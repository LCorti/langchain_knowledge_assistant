[project]
name = "langchain_knowledge_assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LCorti", email = "corti.lorenz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "einops>=0.8.1",
    "faiss-gpu>=1.15.1",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.9",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-huggingface>=1.2.3",
    "numpy>=2.5.4",
    "peft>=0.21.2",
    "pyndeval>=0.0.8",
    "python-dotenv>=1.2.4",
    "pytrec-eval>=0.5",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "spacy>=3.8.18",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.22.1",
]

[project.scripts]
knowledge-assistant = "rag.cli:main"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
